<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>moj-sajt</title>

  <style>
    /* ===== POZADINA: promeni naziv fajla ili ubaci svoj link ka slici ===== */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.38), rgba(0, 0, 0, 0.48)),
        url("pozadina2.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      /* Sadržaj na sredini stranice */
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .glavni-blok {
      width: 100%;
      max-width: 900px;
      padding: 34px 24px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 24px;
      backdrop-filter: blur(3px);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin: 0 0 16px;
      text-shadow: 0 3px 18px rgba(0,0,0,.7);
    }

    .podnaslov {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      margin: 0 0 30px;
    }

    .mreze {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 24px;
    }

    /* Svaka kartica — i ikonica i tekst su jedan link */
    .mreza {
      color: white;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 88px;
      font-weight: bold;
      transition: transform .18s ease, opacity .18s ease;
    }

    .mreza:hover {
      transform: translateY(-5px);
      opacity: .88;
    }

    .ikonica {
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.35);
    }

    .ikonica svg {
      width: 38px;
      height: 38px;
      fill: white;
    }

    .discord { background: #5865F2; }
    .instagram { background: linear-gradient(135deg, #7438c8, #e1306c, #ffb347); }
    .youtube { background: #ff0033; }
    .tiktok { background: #080808; }
    .steam { background: #17406b; }

    .ime-mreze {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .zavrsni-tekst {
      margin: 34px 0 0;
      font-size: 1rem;
    }

    @media (max-width: 480px) {
      .glavni-blok { padding: 28px 14px; }
      .mreze { gap: 20px 14px; }
      .ikonica { width: 60px; height: 60px; border-radius: 17px; }
      .ikonica svg { width: 34px; height: 34px; }
      .mreza { min-width: 78px; }
    }
  </style>
</head>

<body>
  <main class="glavni-blok">

    <!-- PROMENI NASLOV I TEKST ISPOD KAKO ŽELIŠ -->
    <h1>Dobrodošli!</h1>
    <p class="podnaslov">Prati me na društvenim mrežama:</p>

    <div class="mreze">

      <!-- PROMENI href NA SVOJ LINK. Ikonica i tekst su oba klikabilni. -->
      <a class="mreza" href="https://discord.com/@mario21131/" target="_blank" rel="noopener noreferrer">

        </span>
        <span class="ime-mreze">Discord</span>
      </a>

      <a class="mreza" href="https://www.instagram.com/tot02111/" target="_blank" rel="noopener noreferrer">
        <span class="ikonica instagram" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7Zm5 3.1a4.7 4.7 0 1 1 0 9.4 4.7 4.7 0 0 1 0-9.4Zm0 2.2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm5.1-3.6a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/></svg>
        </span>
        <span class="ime-mreze">Instagram</span>
      </a>

      <a class="mreza" href="https://www.youtube.com/@Mario_1507" target="_blank" rel="noopener noreferrer">
        <span class="ikonica youtube" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.6 3.6 12 3.6 12 3.6s-7.6 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.8.5 9.4.5 9.4.5s7.6 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>
        </span>
        <span class="ime-mreze">YouTube</span>
      </a>

      <a class="mreza" href="https://www.tiktok.com/@tot__021/" target="_blank" rel="noopener noreferrer">
        <span class="ikonica tiktok" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M19.6 6.2a6.5 6.5 0 0 1-4.1-4.1V1h-4v14.1a2.7 2.7 0 1 1-2.7-2.7c.4 0 .8.1 1.1.2V8.5a7 7 0 1 0 5.6 6.8V8.1a10.3 10.3 0 0 0 5.2 1.4v-4c-.4.1-.7.1-1.1.7Z"/></svg>
        </span>
        <span class="ime-mreze">TikTok</span>
      </a>

      <a class="mreza" href="https://store.steampowered.com/mario_o33/" target="_blank" rel="noopener noreferrer">
        <span class="ikonica steam" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-9.9 8.6l5.4 2.2a3.7 3.7 0 0 1 2.1-.6l2.4-3.5v-.2a4.8 4.8 0 1 1 4.8 4.8h-.1l-3.4 2.5a3.7 3.7 0 0 1-7.3.7L2.1 15A10 10 0 1 0 12 2Zm4.8 4.7a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4ZM9.6 14a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2Z"/></svg>
        </span>
        <span class="ime-mreze">Steam</span>
      </a>

    </div>

    <!-- PROMENI ILI OBRIŠI ZAVRŠNI TEKST -->
    <p class="zavrsni-tekst">Hvala na poseti! 👑</p>
  </main>
</body>
</html>
